<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <filter id="card-shadow" x="-15%" y="-15%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#0f172a" flood-opacity="0.32"/>
    </filter>
    <filter id="drop-shadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.22"/>
    </filter>
    
  </defs>
  
  <!-- Transparent canvas with rounded squircle badge (Ideal for F-Droid web and client) -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#bg-grad)" filter="url(#card-shadow)"/>
  
  <!-- App Symbol -->
  
        <!-- Modern Rounded Keyboard Base Chassis -->
        <rect x="116" y="156" width="280" height="200" rx="36" fill="#FFFFFF" filter="url(#drop-shadow)"/>
        
        <!-- Row 1: Keycaps -->
        <rect x="142" y="180" width="36" height="32" rx="10" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="3"/>
        <rect x="186" y="180" width="36" height="32" rx="10" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="3"/>
        <rect x="230" y="180" width="36" height="32" rx="10" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="3"/>
        <rect x="274" y="180" width="36" height="32" rx="10" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="3"/>
        <rect x="318" y="180" width="52" height="32" rx="10" fill="#8b5cf6"/>
        <text x="344" y="202" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="900" fill="#FFFFFF" text-anchor="middle">⌫</text>
        
        <!-- Row 2: Keycaps -->
        <rect x="150" y="224" width="36" height="32" rx="10" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="3"/>
        <rect x="194" y="224" width="36" height="32" rx="10" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="3"/>
        <rect x="238" y="224" width="36" height="32" rx="10" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="3"/>
        <rect x="282" y="224" width="36" height="32" rx="10" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="3"/>
        <rect x="326" y="224" width="36" height="32" rx="10" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="3"/>
        
        <!-- Row 3: Spacebar & Function Keys -->
        <rect x="142" y="268" width="44" height="32" rx="10" fill="#ddd6fe"/>
        <text x="164" y="289" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="900" fill="#5b21b6" text-anchor="middle">123</text>
        
        <rect x="194" y="268" width="124" height="32" rx="10" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="3.5"/>
        <line x1="226" y1="284" x2="286" y2="284" stroke="#8b5cf6" stroke-width="3.5" stroke-linecap="round"/>
        
        <rect x="326" y="268" width="44" height="32" rx="10" fill="#7c3aed"/>
        <text x="348" y="289" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="900" fill="#FFFFFF" text-anchor="middle">↵</text>
        
</svg>
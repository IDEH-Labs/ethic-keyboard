apply plugin: 'com.android.application'

def releaseKeystorePath = System.getenv('KEYSTORE_PATH')
def releaseKeyAlias = System.getenv('KEY_ALIAS')
def releaseStorePassword = System.getenv('STORE_PASSWORD')
def releaseKeyPassword = System.getenv('KEY_PASSWORD')
def hasReleaseSigning = [releaseKeystorePath, releaseKeyAlias, releaseStorePassword, releaseKeyPassword]
        .every { it != null && !it.isEmpty() }

android {
    defaultConfig {
        applicationId "org.jpi59.teclado"
        compileSdk 36
        minSdkVersion 24
        targetSdkVersion 36
        versionCode 154
        versionName "6.6.6"
    }
    dependenciesInfo {
        includeInApk = false
        includeInBundle = false
    }
    if (hasReleaseSigning) {
        signingConfigs {
            release {
                storeFile file(releaseKeystorePath)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            vcsInfo {
                include = false
            }
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }
    namespace = 'org.jpi59.teclado'
}

dependencies {
}
